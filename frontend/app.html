<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任務管理 · Task Manager</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%85%3C/text%3E%3C/svg%3E">
  <script src="vendor/tailwind.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans TC"', '"Microsoft JhengHei"', '"PingFang TC"', 'system-ui', 'sans-serif']
          },
          colors: {
            brand: {
              50:  '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca'
            }
          },
          boxShadow: {
            soft: '0 10px 40px -10px rgba(79,70,229,0.25)',
            card: '0 1px 3px rgba(0,0,0,.06), 0 8px 30px -10px rgba(0,0,0,.10)'
          },
          keyframes: {
            fadeUp: {
              '0%': { opacity: 0, transform: 'translateY(8px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' }
            },
            pop: {
              '0%': { transform: 'scale(.96)', opacity: 0 },
              '100%': { transform: 'scale(1)', opacity: 1 }
            }
          },
          animation: {
            fadeUp: 'fadeUp .3s ease-out both',
            pop: 'pop .15s ease-out both'
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="css/style.css">
  <script src="vendor/lucide.js"></script>
</head>
<body class="min-h-screen bg-slate-50 font-sans antialiased text-slate-800">

  <!-- ─────────── Top Nav ─────────── -->
  <header class="sticky top-0 z-30 bg-white/80 backdrop-blur border-b border-slate-200/70">
    <div class="relative max-w-6xl mx-auto px-4 sm:px-5 py-3 flex flex-wrap items-center gap-y-2 gap-x-2 sm:gap-x-4">
      <div class="flex items-center gap-2 sm:gap-2.5 min-w-0">
        <div class="shrink-0 w-9 h-9 rounded-xl bg-gradient-to-br from-brand-500 to-purple-600 grid place-items-center shadow-soft">
          <i data-lucide="check-check" class="w-5 h-5 text-white"></i>
        </div>
        <div class="min-w-0">
          <div class="font-bold text-slate-900 leading-tight truncate">Task Manager</div>
          <div class="hidden sm:block text-[11px] text-slate-500 leading-tight">個人任務管理系統</div>
        </div>
      </div>

      <!-- 日期 / 星期 / 時間 -->
      <!-- PC：絕對定位精確置中（左標題 / 中時間 / 右使用者+登出） -->
      <!-- 手機：order-last + w-full 自動換到第二行置中（第一行為標題+使用者+登出） -->
      <div class="order-last w-full flex justify-center
                  sm:order-none sm:w-auto sm:absolute sm:top-1/2 sm:left-1/2 sm:-translate-x-1/2 sm:-translate-y-1/2">
        <div class="flex items-center gap-2 px-3 sm:px-4 py-1.5 rounded-xl bg-slate-100">
          <i data-lucide="clock" class="w-3.5 h-3.5 text-slate-400"></i>
          <span id="clock-date" class="text-xs font-semibold text-slate-700"></span>
          <span id="clock-time" class="text-xs text-slate-500 tabular-nums"></span>
        </div>
      </div>

      <div class="ml-auto flex items-center gap-2 sm:gap-3">
        <div class="flex items-center gap-1.5 sm:gap-2 px-2 sm:px-3 py-1 sm:py-1.5 rounded-lg bg-slate-100">
          <i data-lucide="user-round" class="hidden sm:block w-4 h-4 text-slate-500"></i>
          <span id="me-name" class="text-xs sm:text-sm font-medium text-slate-700 truncate max-w-[72px] sm:max-w-[140px]">…</span>
        </div>
        <button id="btn-logout"
                class="px-2 sm:px-3 py-1.5 rounded-lg text-sm font-medium text-slate-600 hover:bg-slate-100 transition flex items-center gap-1.5">
          <i data-lucide="log-out" class="w-4 h-4"></i>
          <span>登出</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-5 py-6 space-y-6">

    <!-- ─────────── Stats ─────────── -->
    <section class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 animate-fadeUp">
      <!-- 總數 -->
      <div class="bg-white border border-slate-200/70 rounded-2xl p-4 shadow-card">
        <div class="flex items-center gap-2 text-xs text-slate-500"><i data-lucide="list" class="w-4 h-4"></i>全部任務</div>
        <div id="stat-total" class="text-2xl font-bold mt-1">0</div>
      </div>
      <!-- 完成 -->
      <div class="bg-white border border-slate-200/70 rounded-2xl p-4 shadow-card">
        <div class="flex items-center gap-2 text-xs text-emerald-600"><i data-lucide="check-circle-2" class="w-4 h-4"></i>已完成</div>
        <div id="stat-done" class="text-2xl font-bold mt-1 text-emerald-600">0</div>
      </div>
      <!-- 進行中 -->
      <div class="bg-white border border-slate-200/70 rounded-2xl p-4 shadow-card">
        <div class="flex items-center gap-2 text-xs text-amber-600"><i data-lucide="loader" class="w-4 h-4"></i>進行中</div>
        <div id="stat-pending" class="text-2xl font-bold mt-1 text-amber-600">0</div>
      </div>
      <!-- 今日 -->
      <div class="bg-white border border-slate-200/70 rounded-2xl p-4 shadow-card">
        <div class="flex items-center gap-2 text-xs text-brand-600"><i data-lucide="calendar-clock" class="w-4 h-4"></i>今日到期</div>
        <div id="stat-today" class="text-2xl font-bold mt-1 text-brand-600">0</div>
      </div>
      <!-- 已逾期 -->
      <div class="bg-white border border-slate-200/70 rounded-2xl p-4 shadow-card">
        <div class="flex items-center gap-2 text-xs text-rose-600"><i data-lucide="alarm-clock" class="w-4 h-4"></i>已逾期</div>
        <div id="stat-overdue" class="text-2xl font-bold mt-1 text-rose-600">0</div>
      </div>
      <!-- 完成率 -->
      <div class="bg-gradient-to-br from-brand-600 to-purple-600 rounded-2xl p-4 text-white shadow-soft">
        <div class="flex items-center gap-2 text-xs opacity-90"><i data-lucide="trending-up" class="w-4 h-4"></i>完成率</div>
        <div class="flex items-end justify-between mt-1">
          <div id="stat-rate" class="text-2xl font-bold">0%</div>
          <div class="w-16 h-1.5 bg-white/30 rounded-full overflow-hidden">
            <div id="stat-rate-bar" class="h-full bg-white/90 transition-all" style="width:0%"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ─────────── Toolbar ─────────── -->
    <section class="bg-white border border-slate-200/70 rounded-2xl p-4 shadow-card flex flex-wrap items-center gap-3">
      <!-- 狀態篩選（下拉） -->
      <select id="filter-status"
              class="px-3 py-2 rounded-xl bg-slate-100 text-sm font-medium text-slate-700 border-0 focus:ring-2 focus:ring-brand-200 outline-none cursor-pointer">
        <option value="all">全部狀態</option>
        <option value="overdue">已逾期</option>
        <option value="today">今日到期</option>
        <option value="active">進行中</option>
        <option value="done">已完成</option>
      </select>

      <!-- 優先級 -->
      <select id="filter-priority"
              class="px-3 py-2 rounded-xl bg-slate-100 text-sm font-medium text-slate-700 border-0 focus:ring-2 focus:ring-brand-200 outline-none">
        <option value="">全部優先級</option>
        <option value="high">高優先</option>
        <option value="medium">中優先</option>
        <option value="low">低優先</option>
      </select>

      <!-- 搜尋 -->
      <div class="relative flex-1 min-w-[200px]">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
        <input id="search" type="search" placeholder="搜尋標題或描述…"
               class="w-full pl-9 pr-3 py-2 rounded-xl bg-slate-100 text-sm focus:bg-white focus:ring-2 focus:ring-brand-200 outline-none transition">
      </div>

      <!-- 新增 -->
      <button id="btn-new"
              class="ml-auto px-4 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-700 hover:to-purple-700 text-white font-semibold shadow-soft transition active:scale-[0.99] flex items-center gap-1.5">
        <i data-lucide="plus" class="w-4 h-4"></i>
        <span>新增任務</span>
      </button>
    </section>

    <!-- ─────────── Task sections ─────────── -->
    <section id="sections" class="space-y-8"></section>

    <!-- Loading -->
    <div id="loading" class="hidden text-center py-12 text-slate-400 text-sm">
      <i data-lucide="loader-2" class="w-5 h-5 inline animate-spin mr-2"></i>載入中…
    </div>
  </main>

  <!-- ─────────── Modal ─────────── -->
  <div id="modal" class="fixed inset-0 z-40 hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" data-close></div>
    <div class="relative max-w-lg mx-auto mt-16 bg-white rounded-2xl shadow-2xl animate-pop">
      <form id="task-form" class="p-6 space-y-4">
        <div class="flex items-center justify-between">
          <h3 id="modal-title" class="text-lg font-bold">新增任務</h3>
          <button type="button" data-close class="w-8 h-8 grid place-items-center rounded-lg hover:bg-slate-100">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div>
          <label class="text-xs font-medium text-slate-600">標題 <span class="text-rose-500">*</span></label>
          <input id="f-title" required maxlength="120"
                 class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none">
        </div>

        <div>
          <label class="text-xs font-medium text-slate-600">描述 <span class="text-slate-400">（可換行）</span></label>
          <textarea id="f-desc" rows="4"
                    class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none resize-y"></textarea>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="text-xs font-medium text-slate-600">優先級</label>
            <select id="f-priority"
                    class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none bg-white">
              <option value="low">低</option>
              <option value="medium" selected>中</option>
              <option value="high">高</option>
            </select>
          </div>
          <div>
            <label class="text-xs font-medium text-slate-600">截止日期 <span class="text-rose-500">*</span></label>
            <input id="f-due" type="date" required
                   class="mt-1 w-full px-3 py-2.5 rounded-lg border border-slate-200 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 outline-none">
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" data-close
                  class="px-4 py-2 rounded-lg text-slate-600 hover:bg-slate-100 transition">取消</button>
          <button type="submit"
                  class="px-4 py-2 rounded-lg bg-gradient-to-r from-brand-600 to-purple-600 hover:from-brand-700 hover:to-purple-700 text-white font-semibold shadow-soft transition">
            儲存
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ─────────── 任務放大檢視 ─────────── -->
  <div id="card-overlay" class="fixed inset-0 z-40 hidden">
    <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" data-card-close></div>
    <div class="relative max-w-xl mx-auto mt-16 px-4">
      <div id="card-large" class="bg-white rounded-2xl shadow-2xl animate-pop"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed top-5 right-5 hidden z-50">
    <div class="px-4 py-3 rounded-xl shadow-card text-sm font-medium"></div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
